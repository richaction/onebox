[package]
name = "onebox"
version = "0.1.0"
description = "onebox markdown editor"
edition = "2021"

[lib]
name = "onebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "rt", "macros"] }
