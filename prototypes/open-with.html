<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>非 MD 预览 · 打开方式 — 原型</title>
<style>
  :root {
    --surface: #f2f2f4;
    --card: #ffffff;
    --hair: #e8e8ec;
    --hair-strong: #dcdce1;
    --ink: #1c1c1e;
    --sub: #6e6e73;
    --muted: #8e8e93;
    --hover: #f4f4f6;
    --accent: #22c55e;
    --radius-pill: 13px;
    --shadow-card:
      0 1px 2px rgba(16, 16, 20, 0.06),
      0 12px 32px -12px rgba(16, 16, 20, 0.22),
      0 0 0 1px rgba(16, 16, 20, 0.04);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 32px 24px;
  }

  .window {
    width: min(860px, 100%);
    background: var(--card);
    border-radius: 16px;
    box-shadow:
      0 1px 2px rgba(16, 16, 20, 0.05),
      0 30px 70px -40px rgba(16, 16, 20, 0.35);
    overflow: hidden;
  }

  /* ---------- toolbar ---------- */

  .toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
    padding: 0 14px 0 18px;
    border-bottom: 1px solid var(--hair);
  }

  .file {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .file__icon { width: 20px; height: 20px; flex: none; }

  .file__name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .file__meta {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    padding-left: 2px;
  }

  .toolbar__spacer { flex: 1; }

  /* ---------- open-with ---------- */

  .ow { position: relative; }

  .ow-trigger {
    display: inline-flex;
    align-items: stretch;
    height: 40px;
    padding: 0;
    border: 1px solid var(--hair);
    border-radius: var(--radius-pill);
    background: var(--card);
    box-shadow: 0 1px 2px rgba(16, 16, 20, 0.04);
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease;
  }

  .ow-trigger:hover { background: #fafafa; border-color: var(--hair-strong); }

  .ow-trigger:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .ow-trigger__app { display: grid; place-items: center; width: 40px; }

  .ow-trigger__sep {
    width: 1px;
    align-self: center;
    height: 18px;
    background: var(--hair);
  }

  .ow-trigger__chev {
    display: grid;
    place-items: center;
    width: 30px;
    color: var(--muted);
    transition: transform 0.18s ease;
  }

  .ow[data-open="true"] .ow-trigger__chev { transform: rotate(180deg); }

  .ow-card {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 268px;
    padding: 6px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    opacity: 0;
    transform: translateY(-4px) scale(0.985);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
    z-index: 10;
  }

  .ow[data-open="true"] .ow-card {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .ow-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-align: left;
    cursor: default;
  }

  .ow-row:hover,
  .ow-row[data-active="true"] { background: var(--hover); }

  .ow-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .ow-row__label { flex: 1; min-width: 0; }

  .ow-row__check {
    width: 16px;
    height: 16px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .ow-row[aria-selected="true"] .ow-row__check { opacity: 1; }

  .app-icon { width: 22px; height: 22px; border-radius: 6px; flex: none; display: block; }

  /* ---------- preview body ---------- */

  .preview {
    height: 420px;
    display: grid;
    place-items: center;
    background:
      radial-gradient(120% 120% at 30% 20%, #fbfbfc 0%, #f5f5f7 60%, #f0f0f2 100%);
  }

  .preview__mark {
    width: 220px;
    height: 140px;
    border-radius: 10px;
    background:
      linear-gradient(135deg, #e7e7ec 0%, #ececf1 45%, #e3e3e9 100%);
    box-shadow: inset 0 0 0 1px rgba(16, 16, 20, 0.04);
    display: grid;
    place-items: center;
    color: #b9b9c0;
  }

  @media (prefers-reduced-motion: reduce) {
    .ow-trigger, .ow-trigger__chev, .ow-card, .ow-row__check { transition: none; }
  }
</style>
</head>
<body>

<div class="window">
  <header class="toolbar">
    <div class="file">
      <svg class="file__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="#f1f1f4" stroke="#d9d9df" stroke-width="1.2"/>
        <circle cx="9" cy="10" r="1.8" fill="#b9b9c0"/>
        <path d="M4.5 17.5l4.6-4.3a1.4 1.4 0 0 1 1.9 0l3 2.8 2.1-1.9a1.4 1.4 0 0 1 1.9 0l1.5 1.4"
          stroke="#b9b9c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="file__name">diagram.png</span>
      <span class="file__meta">1920 × 1080</span>
    </div>

    <div class="toolbar__spacer"></div>

    <div class="ow" data-open="false" id="openWith">
      <button
        class="ow-trigger"
        type="button"
        id="owTrigger"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-controls="owCard"
        aria-label="打开方式"
      >
        <span class="ow-trigger__app" id="owCurrentIcon" aria-hidden="true"></span>
        <span class="ow-trigger__sep" aria-hidden="true"></span>
        <span class="ow-trigger__chev" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <path d="M4 6.5 8 10.5l4-4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <div class="ow-card" id="owCard" role="listbox" aria-label="打开方式" tabindex="-1"></div>
    </div>
  </header>

  <section class="preview" aria-label="文件预览">
    <div class="preview__mark">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="9" cy="10" r="1.8" fill="currentColor"/>
        <path d="M4.5 17.5l4.6-4.3a1.4 1.4 0 0 1 1.9 0l3 2.8 2.1-1.9a1.4 1.4 0 0 1 1.9 0l1.5 1.4"
          stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </section>
</div>

<script>
  // 预览态的应用列表。真实实现里由 Rust 侧按文件类型枚举系统处理器，
  // 再补上「访达」「终端」两项；这里用固定数据演示交互。
  const APPS = [
    { id: 'preview', name: '预览' },
    { id: 'qoder', name: 'Qoder IDE' },
    { id: 'finder', name: '访达' },
    { id: 'idea', name: 'IntelliJ IDEA' },
    { id: 'terminal', name: '终端' },
  ];

  const ICONS = {
    preview: `
      <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="pvGrad" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fdfdfe"/>
            <stop offset="1" stop-color="#e9e9ef"/>
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="6" fill="url(#pvGrad)" stroke="#d9d9df" stroke-width="0.8"/>
        <rect x="5" y="6.5" width="14" height="11" rx="2.2" fill="#fff" stroke="#b9b9c0" stroke-width="1"/>
        <circle cx="9" cy="10.4" r="1.2" fill="#b9b9c0"/>
        <path d="M5.8 15.6l3.4-3.1a1 1 0 0 1 1.3 0l2.2 2 1.5-1.3a1 1 0 0 1 1.3 0l1.7 1.5"
          stroke="#b9b9c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>`,
    qoder: `
      <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="#0b0b0d"/>
        <circle cx="12" cy="12" r="5.4" fill="none" stroke="#22c55e" stroke-width="2.1"
          stroke-linecap="round" stroke-dasharray="26 7" transform="rotate(-38 12 12)"/>
      </svg>`,
    finder: `
      <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="finderGrad" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#38bdf8"/>
            <stop offset="1" stop-color="#0a84ff"/>
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="6" fill="url(#finderGrad)"/>
        <path d="M8.4 8.6v3.1M15.6 8.6v3.1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8 15.2c1.1 1.5 2.5 2.2 4 2.2s2.9-.7 4-2.2"
          stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>`,
    idea: `
      <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="ideaGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f97a12"/>
            <stop offset="0.45" stop-color="#fe2857"/>
            <stop offset="1" stop-color="#3e7bfa"/>
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="6" fill="url(#ideaGrad)"/>
        <text x="12" y="16.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="9" font-weight="700" fill="#fff">IJ</text>
      </svg>`,
    terminal: `
      <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="#0b0b0d"/>
        <path d="M7 9l3.2 3L7 15" stroke="#fff" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M12.2 15.2h4.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>`,
  };

  const root = document.getElementById('openWith');
  const trigger = document.getElementById('owTrigger');
  const card = document.getElementById('owCard');
  const currentIcon = document.getElementById('owCurrentIcon');

  // 默认处理器：真实实现里由系统针对该文件类型给出
  let selected = 'preview';
  let activeIndex = -1;

  card.innerHTML = APPS.map((app) => `
    <button class="ow-row" type="button" role="option" data-app="${app.id}"
      aria-selected="${app.id === selected}" tabindex="-1">
      ${ICONS[app.id]}
      <span class="ow-row__label">${app.name}</span>
      <svg class="ow-row__check" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3.5 8.5 6.5 11.5 12.5 4.8" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  `).join('');

  const rows = [...card.querySelectorAll('.ow-row')];

  function renderTrigger() {
    currentIcon.innerHTML = ICONS[selected];
    rows.forEach((row) => row.setAttribute('aria-selected', String(row.dataset.app === selected)));
  }

  function isOpen() { return root.dataset.open === 'true'; }

  function open(index = APPS.findIndex((a) => a.id === selected)) {
    root.dataset.open = 'true';
    trigger.setAttribute('aria-expanded', 'true');
    setActive(index);
  }

  function close({ restoreFocus = true } = {}) {
    root.dataset.open = 'false';
    trigger.setAttribute('aria-expanded', 'false');
    setActive(-1);
    if (restoreFocus) trigger.focus();
  }

  function setActive(index) {
    activeIndex = index;
    rows.forEach((row, i) => {
      row.dataset.active = String(i === index);
      row.tabIndex = i === index ? 0 : -1;
    });
    if (index >= 0) rows[index].focus();
    else card.focus({ preventScroll: true });
  }

  function choose(id) {
    selected = id;
    renderTrigger();
    close();
  }

  trigger.addEventListener('click', () => {
    if (isOpen()) close();
    else open();
  });

  trigger.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      open(0);
    }
  });

  rows.forEach((row, i) => {
    row.addEventListener('click', () => choose(row.dataset.app));
    row.addEventListener('mouseenter', () => {
      if (activeIndex !== i) {
        activeIndex = i;
        rows.forEach((r, j) => { r.dataset.active = String(j === i); });
      }
    });
  });

  card.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { event.preventDefault(); close(); return; }
    if (event.key === 'ArrowDown') { event.preventDefault(); setActive((activeIndex + 1) % rows.length); return; }
    if (event.key === 'ArrowUp') { event.preventDefault(); setActive((activeIndex - 1 + rows.length) % rows.length); return; }
    if (event.key === 'Home') { event.preventDefault(); setActive(0); return; }
    if (event.key === 'End') { event.preventDefault(); setActive(rows.length - 1); return; }
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (activeIndex >= 0) choose(rows[activeIndex].dataset.app);
    }
  });

  document.addEventListener('pointerdown', (event) => {
    if (isOpen() && !root.contains(event.target)) close({ restoreFocus: false });
  });

  document.addEventListener('focusin', (event) => {
    if (isOpen() && !root.contains(event.target)) close({ restoreFocus: false });
  });

  renderTrigger();
</script>
</body>
</html>
